---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubevirt-cni
  namespace: {{ .Release.Namespace }}
  labels:
    app: kubevirt-cni

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubevirt-cni
  namespace: {{ .Release.Namespace }}
  labels:
    app: kubevirt-cni
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["*"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubevirt-cni
  labels:
    app: kubevirt-cni
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubevirt-cni
subjects:
  - name: kubevirt-cni
    namespace: {{ .Release.Namespace }}
    kind: ServiceAccount
