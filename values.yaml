# Default values for helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

images:
  pullPolicy: IfNotPresent
  registry: registry.gitlab.com
  tags:
    curl: 'sonaproject/tool-docker:latest'
    python: 'sonaproject/python-docker:latest'
    onos: 'sonaproject/onos-sona-nightly-docker:kubevirt-3-4'
    leader: 'sonaproject/leader-elector:1.0'
  # pullSecrets: regcred

config:
  port: 9393
  nameOverride: ""
  fullnameOverride: ""

leader:
  port: 4040
  nameOverride: ""
  fullnameOverride: ""

meo:
  datacenter_id: BD
  cluster_id: BD-MEH-CT01
  
onos:
  replicaCount: 1
  hostNetwork: false
  nodeSelector:
    key: ""
    value: ""
  apiServer: "127.0.0.1"
  serviceFqdn: "sona-onos.edgestack.svc.cluster.local"
  apiServerFqdn: "kubernetes.default.svc.cluster.local"
  config:
    allowExtraRules: true
  port:
    openflow: 6653
    ovsdb: 6640
    onosWeb: 8181
    onosSsh: 8101
    onosCluster: 9876
    prometheusExporter: 9300

  # indicate the dataplane mode (either NORMAL or DPDK)
  networkMode: "NORMAL"

  resources:
    limits: {}
    requests:
      memory: 4096Mi
      cpu: 1024m
  nameOverride: ""
  fullnameOverride: ""
